<title>Channel Surfer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08102a;--bg2:#0b1230;--row-a:#101640;--row-b:#0d1338;--row-hover:#192060;--row-active:#1e2868;--border:#1a2050;--border2:#222860;--amber:#ffb000;--white:#fff;--text:#a8b4d8;--text2:#5060a0;--text3:#2a3468;--red:#cc2000;--ch-w:120px;--slot-w:160px;--row-h:56px;--tb-h:38px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:12px}
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
.sp-logo{font-size:clamp(32px,6vw,72px);font-weight:800;color:var(--white)}.sp-logo span{color:var(--amber)}
.sp-sub{color:var(--text2);font-size:15px}
.sp-bar-wrap{width:320px;max-width:80vw;height:4px;background:var(--border2);border-radius:2px;margin-top:20px;overflow:hidden}
.sp-bar{height:100%;width:0%;background:var(--amber);transition:width .3s;border-radius:2px}
.sp-prog{color:var(--text2);font-size:12px;margin-top:8px}
.sp-btn{margin-top:28px;padding:12px 40px;background:var(--amber);color:#000;font-weight:700;font-size:15px;border:none;cursor:pointer;border-radius:3px;display:none}
.sp-btn:hover{opacity:.85}
#app{width:100vw;height:100vh;display:none;flex-direction:column}
#top{display:flex;flex-shrink:0;height:40vh;min-height:220px;border-bottom:2px solid var(--border2)}
#player-wrap{flex:0 0 53%;position:relative;background:#000;overflow:hidden}
#player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;transition:opacity .3s}
#nosig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#060c22}
.nosig-t{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--text3)}
.nosig-s{font-size:11px;letter-spacing:2px;color:var(--text3)}
#info{flex:1;background:var(--bg2);padding:20px 26px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--border2);overflow:hidden}
.info-chname{font-size:24px;font-weight:700;color:var(--white)}
.info-title{font-size:15px;color:var(--amber);font-weight:600;line-height:1.4;margin-top:6px}
.info-meta{font-size:12px;color:var(--text2);margin-top:4px}.info-meta b{color:var(--text)}
#gtoggle{flex-shrink:0;height:26px;background:var(--bg2);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text2);font-size:11px;letter-spacing:1.5px;user-select:none}
#gtoggle:hover{background:var(--border);color:var(--text)}
#guide{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#timebar{display:flex;flex-shrink:0;height:var(--tb-h);background:var(--bg2);border-bottom:1px solid var(--border2);overflow:hidden}
#tb-spacer{flex-shrink:0;width:var(--ch-w);border-right:1px solid var(--border2)}
#tb-scroll{flex:1;overflow:hidden}
#tb-inner{display:flex;height:100%}
.tlabel{flex-shrink:0;width:var(--slot-w);height:100%;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:var(--text2);border-right:1px solid var(--border);white-space:nowrap}
.tlabel.isnow{color:var(--amber)}
#rows-wrap{flex:1;overflow:hidden}
#rows-scroll{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
#rows-scroll::-webkit-scrollbar{width:4px}
#rows-scroll::-webkit-scrollbar-thumb{background:var(--border2)}
.ch-row{display:flex;height:var(--row-h);border-bottom:1px solid var(--border);cursor:pointer}
.ch-row:nth-child(odd){background:var(--row-a)}.ch-row:nth-child(even){background:var(--row-b)}
.ch-row:hover{background:var(--row-hover)}.ch-row.is-active{background:var(--row-active)}
.ch-label{flex-shrink:0;width:var(--ch-w);display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border-right:1px solid var(--border2);gap:1px}
.ch-num{font-size:20px;font-weight:700;color:var(--amber);line-height:1}
.ch-name{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;line-height:1.3;word-break:break-word}
.ch-slots{flex:1;display:flex;position:relative;overflow:hidden}
.slot{flex-shrink:0;height:100%;border-right:1px solid var(--border);display:flex;align-items:center;padding:0 7px;overflow:hidden;cursor:pointer;transition:background .1s}
.slot:hover{background:rgba(255,176,0,.07)}.slot.is-now{background:rgba(255,176,0,.04)}
.slot-t{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;pointer-events:none}
.slot.is-now .slot-t,.is-active .slot.is-now .slot-t{color:var(--amber);font-weight:600}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:10;pointer-events:none;box-shadow:0 0 8px rgba(200,0,0,.6)}
#statusbar{flex-shrink:0;height:32px;background:#060c22;border-top:1px solid var(--border2);display:flex;align-items:center;padding:0 14px;gap:14px}
.sb-logo{font-weight:800;font-size:13px;color:var(--white)}
.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:sbp 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes sbp{0%,100%{opacity:1}50%{opacity:.3}}
.sb-txt{font-size:11px;color:var(--text2)}
.sb-sep{width:1px;height:14px;background:var(--border2)}
.sb-right{margin-left:auto;display:flex;gap:10px}
.sb-btn{font-size:11px;color:var(--text2);cursor:pointer;border:1px solid var(--border2);padding:2px 8px;border-radius:2px;transition:all .15s}
.sb-btn:hover{border-color:var(--amber);color:var(--amber)}
</style>
</head>

    </div>
  </div>
  <div id="gtoggle" onclick="toggleGuide()"><span id="gi">↑</span>&nbsp;<span id="gt">HIDE GUIDE</span></div>
  <div id="guide">
    <div id="timebar"><div id="tb-spacer"></div><div id="tb-scroll"><div id="tb-inner"></div></div></div>
    <div id="rows-wrap"><div id="rows-scroll"><div id="rows-inner"></div></div></div>
  </div>
  <div id="statusbar">
    <div class="sb-logo">📺 CHANNEL SURFER</div>
    <div class="sb-dot"></div>

    <div class="sb-sep"></div>

    <div class="sb-right"><div class="sb-btn" onclick="toggleGuide()">G: GUIDE</div></div>
  </div>
</div>

// ── SCHEDULE (deterministic) ──
const SLOT_MS = 30*60*1000, SLOTS = 18, SLOT_PX = 160;
function seed(id){return String(id).split('').reduce((a,c,i)=>a+c.charCodeAt(0)*(i+7),0)}
function getSchedule(ch){
  const vs=ch.v; if(!vs||!vs.length) return null;
  const s=seed(ch.num);
  const nowMs=Date.now();
  const dayMs=Math.floor(nowMs/86400000)*86400000;
  const slotOfDay=Math.floor((nowMs-dayMs)/SLOT_MS);
  return {v:vs[(slotOfDay+s)%vs.length], startSec:0};
}
function getGuide(ch,startMs){
  const vs=ch.v; if(!vs||!vs.length) return Array(SLOTS+2).fill('');
  const s=seed(ch.num);
  return Array.from({length:SLOTS+2},(_,i)=>{
    const ms=startMs+i*SLOT_MS;
    const dayMs=Math.floor(ms/86400000)*86400000;
    const slotOfDay=Math.floor((ms-dayMs)/SLOT_MS);
    return vs[(slotOfDay+s)%vs.length].t;
  });
}
function snapSlot(ms){return Math.floor(ms/SLOT_MS)*SLOT_MS}
function fmtTime(ms){const d=new Date(ms);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${String(m).padStart(2,'0')} ${ap}`}
function fmtClock(){const d=new Date();let h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();const ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ap}`}

// ── RSS LOADER ──
// Tries multiple CORS proxies in sequence until one works.
// Results cached in localStorage for 24 hours to avoid re-fetching.
const PROXIES = [
  ucid => `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id='+ucid)}`,
  ucid => `https://corsproxy.io/?${encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id='+ucid)}`,
  ucid => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id='+ucid)}`,
];

function parseRSSXML(xml){
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'text/xml');
  const videos = [];
  doc.querySelectorAll('entry').forEach(e => {
    // yt:videoId is in a namespace - try multiple selectors
    let id = e.getElementsByTagName('yt:videoId')[0]?.textContent
           || e.getElementsByTagNameNS('http://www.youtube.com/xml/schemas/2015','videoId')[0]?.textContent;
    // Fallback: extract from <id> tag which looks like yt:video:VIDEO_ID
    if(!id){
      const idTag = e.querySelector('id')?.textContent || '';
      const m = idTag.match(/video:([A-Za-z0-9_-]{11})/);
      if(m) id = m[1];
    }
    // Fallback: extract from <link> href
    if(!id){
      const href = e.querySelector('link')?.getAttribute('href') || '';
      const m = href.match(/v=([A-Za-z0-9_-]{11})/);
      if(m) id = m[1];
    }
    const title = e.querySelector('title')?.textContent || '';
    if(id && title && id.length === 11) videos.push({id:id.trim(), t:title.trim()});
  });
  return videos;
}

const CACHE_KEY = 'cs_feeds_v3';
const CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hours

function loadCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return {};
    const {ts, data} = JSON.parse(raw);
    if(Date.now() - ts > CACHE_TTL) return {};
    return data || {};
  } catch(e){ return {}; }
}
function saveCache(data){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), data})); } catch(e){}
}

async function fetchChannelVideos(ucid, cache){
  if(cache[ucid] && cache[ucid].length > 0) return cache[ucid];
  for(const makeUrl of PROXIES){
    try {
      const url = makeUrl(ucid);
      const r = await fetch(url, {signal: AbortSignal.timeout(10000)});
      if(!r.ok) continue;
      // allorigins returns JSON wrapper; others return raw XML
      const text = await r.text();
      let xml = text;
      if(text.trim().startsWith('{')){
        try { xml = JSON.parse(text).contents || ''; } catch(e){ continue; }
      }
      if(!xml || !xml.includes('<entry>')) continue;
      const videos = parseRSSXML(xml);
      if(videos.length > 0){
        cache[ucid] = videos;
        return videos;
      }
    } catch(e){ continue; }
  }
  return [];
}

// ── STATE ──
let activeCh=null, guideOpen=true, nowMs=Date.now(), guideStart=snapSlot(Date.now())-SLOT_MS;
function nowPx(){return((nowMs-guideStart)/SLOT_MS)*SLOT_PX}

// ── TIMEBAR ──
function renderTimebar(){
  const el=document.getElementById('tb-inner'); el.innerHTML='';
  for(let i=0;i<SLOTS+2;i++){
    const t=guideStart+i*SLOT_MS, isNow=(t<=nowMs&&nowMs<t+SLOT_MS);
    const d=document.createElement('div');
    d.className='tlabel'+(isNow?' isnow':'');
    d.style.width=SLOT_PX+'px';
    d.textContent=(isNow?'▶ ':'')+fmtTime(t);
    el.appendChild(d);
  }
}

// ── ROWS ──
function renderRows(){
  const inner=document.getElementById('rows-inner'); inner.innerHTML='';
  CHANNELS.forEach(ch=>{
    if(!ch.v||!ch.v.length) return; // skip channels with no videos yet
    const row=document.createElement('div');
    row.className='ch-row'+(activeCh?.num===ch.num?' is-active':'');
    row.dataset.num=ch.num;
    row.innerHTML=`<div class="ch-label"><div class="ch-num">${ch.num}</div><div class="ch-name">${ch.name}</div></div>`;
    const slots=document.createElement('div'); slots.className='ch-slots';
    const titles=getGuide(ch,guideStart);
    for(let i=0;i<SLOTS+2;i++){
      const t=guideStart+i*SLOT_MS, isNow=(t<=nowMs&&nowMs<t+SLOT_MS);
      const s=document.createElement('div');
      s.className='slot'+(isNow?' is-now':'');
      s.style.width=SLOT_PX+'px';
      const txt=document.createElement('div'); txt.className='slot-t'; txt.textContent=titles[i]||''; txt.title=titles[i]||'';
      s.appendChild(txt); s.addEventListener('click',()=>tune(ch)); slots.appendChild(s);
    }
    const line=document.createElement('div'); line.className='now-line'; line.style.left=nowPx()+'px';
    slots.appendChild(line); row.appendChild(slots);
    row.addEventListener('click',()=>tune(ch)); inner.appendChild(row);
  });
}

// ── TUNE ──
function tune(ch){
  activeCh=ch; renderRows();
  document.getElementById('info-chname').textContent=ch.name;
  document.getElementById('info-title').textContent='Tuning...';
  document.getElementById('info-meta').textContent='Ch '+ch.num;
  const wrap=document.getElementById('player-wrap');
  document.getElementById('nosig').style.display='flex';
  const old=wrap.querySelector('iframe'); if(old) old.remove();
  const sched=getSchedule(ch);
  if(!sched){document.getElementById('info-title').textContent='No videos available'; return;}
  document.getElementById('info-title').textContent='"'+sched.v.t+'"';
  document.getElementById('info-meta').innerHTML='<b>'+fmtClock()+'</b> &nbsp; Ch '+ch.num+' — '+ch.name;
  document.getElementById('nosig').style.display='none';
  const iframe=document.createElement('iframe');
  iframe.src=`https://www.youtube-nocookie.com/embed/${sched.v.id}?autoplay=1&start=0&controls=1&modestbranding=1&rel=0&iv_load_policy=3&loop=1&playlist=${sched.v.id}&origin=${encodeURIComponent(location.origin)}`;
  iframe.setAttribute('referrerpolicy','no-referrer-when-downgrade');
  iframe.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';
  iframe.allowFullscreen=true; iframe.style.opacity='0'; iframe.style.transition='opacity .3s';
  wrap.appendChild(iframe); requestAnimationFrame(()=>requestAnimationFrame(()=>iframe.style.opacity='1'));
}

// ── GUIDE TOGGLE ──
function toggleGuide(){
  guideOpen=!guideOpen;
  document.getElementById('guide').style.display=guideOpen?'flex':'none';
  document.getElementById('gi').textContent=guideOpen?'↑':'↓';
  document.getElementById('gt').textContent=guideOpen?'HIDE GUIDE':'SHOW GUIDE';
}

// ── KEYBOARD ──
document.addEventListener('keydown',e=>{
  if(e.key==='g'||e.key==='G'){toggleGuide();return;}
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();
    const visible=CHANNELS.filter(c=>c.v&&c.v.length);
    const idx=activeCh?visible.findIndex(c=>c.num===activeCh.num):0;
    const next=e.key==='ArrowUp'?Math.max(0,idx-1):Math.min(visible.length-1,idx+1);
    tune(visible[next]);
    setTimeout(()=>document.querySelector(`.ch-row[data-num="${visible[next].num}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'}),50);
  }
});

// ── GAMEPAD ──
let gps={};
(function poll(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const p of pads){if(!p)continue;
    [[0,'Enter'],[12,'ArrowUp'],[13,'ArrowDown'],[14,'ArrowLeft'],[15,'ArrowRight']].forEach(([b,k])=>{
      const on=p.buttons[b]?.pressed;
      if(on&&!gps[b])document.dispatchEvent(new KeyboardEvent('keydown',{key:k}));
      gps[b]=on;
    });
    const ay=p.axes[1]||0;
    if(ay<-0.6&&!gps.u){document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp'}));gps.u=true;}else if(ay>=-0.6)gps.u=false;
    if(ay>0.6&&!gps.d){document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown'}));gps.d=true;}else if(ay<=0.6)gps.d=false;
  }
  requestAnimationFrame(poll);
})();

// ── TOUCH ──
let ty=0;
document.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientY-ty;if(d<-50)document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown'}));if(d>50)document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp'}));},{passive:true});

setInterval(()=>{w+=Math.floor(Math.random()*7)-3;w=Math.max(15,Math.min(250,w));document.getElementById('sb-w').textContent=w+' watching';},7000);

function launchApp(){
  document.getElementById('splash').classList.add('hide');
  setTimeout(()=>document.getElementById('splash').style.display='none',500);
  document.getElementById('app').style.display='flex';
  nowMs=Date.now(); guideStart=snapSlot(nowMs)-SLOT_MS;
  renderTimebar(); renderRows();
  const firstWithVideos=CHANNELS.find(c=>c.v&&c.v.length);
  if(firstWithVideos) setTimeout(()=>tune(firstWithVideos),600);
  setInterval(()=>{
    nowMs=Date.now();
    guideStart=snapSlot(nowMs)-SLOT_MS;
    renderTimebar(); renderRows();
  },15000);
}

// ── STARTUP: load RSS feeds for all subscription channels ──
(async function loadFeeds(){
  const bar=document.getElementById('sp-bar');
  const prog=document.getElementById('sp-prog');
  const btn=document.getElementById('sp-btn');
  const total=SUB_CHANNELS.length;
  let done=0;

  // Load cache first — if we have fresh data, show it immediately
  const cache = loadCache();
  const cachedCount = Object.keys(cache).length;
  if(cachedCount > 50){
    prog.textContent=`Using cached data (${cachedCount} channels)...`;
    SUB_CHANNELS.forEach(ch=>{ if(cache[ch.ucid]) ch.v=cache[ch.ucid]; });
    bar.style.width='100%';
    setTimeout(launchApp, 600);
    // Refresh cache in background silently
    refreshInBackground(cache);
    return;
  }

  // Fresh load — batches of 8, try all proxies per channel
  const BATCH=8;
  for(let i=0;i<SUB_CHANNELS.length;i+=BATCH){
    const batch=SUB_CHANNELS.slice(i,i+BATCH);
    await Promise.all(batch.map(async ch=>{
      const videos=await fetchChannelVideos(ch.ucid, cache);
      ch.v=videos;
      done++;
      const pct=Math.round((done/total)*100);
      bar.style.width=pct+'%';
      prog.textContent=`Loading your channels... ${done} / ${total}`;
    }));
    // Save cache incrementally
    saveCache(cache);
  }

  const loaded=SUB_CHANNELS.filter(ch=>ch.v.length>0).length;
  prog.textContent=`✓ Ready — ${loaded} channels loaded`;
  saveCache(cache);
  setTimeout(launchApp, 800);
})();

async function refreshInBackground(cache){
  const BATCH=8;
  for(let i=0;i<SUB_CHANNELS.length;i+=BATCH){
    const batch=SUB_CHANNELS.slice(i,i+BATCH);
    await Promise.all(batch.map(async ch=>{
      // Force re-fetch by temporarily clearing cache entry
      const old=cache[ch.ucid]; delete cache[ch.ucid];
      const videos=await fetchChannelVideos(ch.ucid, cache);
      if(videos.length>0) ch.v=videos;
      else if(old) cache[ch.ucid]=old; // restore if new fetch failed
    }));
    saveCache(cache);
    await new Promise(r=>setTimeout(r,200));
  }
}
</script>
