<meta charset="UTF-8">

<title>Channel Surfer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08102a;--bg2:#0b1230;--row-a:#101640;--row-b:#0d1338;
  --row-hover:#192060;--row-active:#1e2868;--border:#1a2050;--border2:#222860;
  --amber:#ffb000;--white:#fff;--text:#a8b4d8;--text2:#5060a0;--text3:#2a3468;--red:#cc2000;
  --chw:120px;--sw:160px;--rh:56px;--tbh:38px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;font-size:12px}
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
.sp-logo{font-size:clamp(32px,6vw,72px);font-weight:800;color:#fff}.sp-logo span{color:var(--amber)}
.sp-sub{color:var(--text2);font-size:15px}
.sp-btn{margin-top:28px;padding:12px 40px;background:var(--amber);color:#000;font-weight:700;font-size:15px;border:none;cursor:pointer;border-radius:3px}
#app{width:100vw;height:100vh;display:none;flex-direction:column}
#top{display:flex;flex-shrink:0;height:40vh;min-height:220px;border-bottom:2px solid var(--border2)}
#pw{flex:0 0 53%;position:relative;background:#000;overflow:hidden}
#pw iframe{position:absolute;inset:0;width:100%;height:100%;border:none;transition:opacity .3s}
#nosig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#060c22}
.nt{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--text3)}
.ns{font-size:11px;letter-spacing:2px;color:var(--text3)}
#info{flex:1;background:var(--bg2);padding:20px 26px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--border2);overflow:hidden}
.icn{font-size:24px;font-weight:700;color:#fff}.itt{font-size:15px;color:var(--amber);font-weight:600;line-height:1.4;margin-top:6px}.imt{font-size:12px;color:var(--text2);margin-top:4px}.imt b{color:var(--text)}
#gt{flex-shrink:0;height:26px;background:var(--bg2);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text2);font-size:11px;letter-spacing:1.5px;user-select:none}
#gt:hover{background:var(--border);color:var(--text)}
#guide{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#tb{display:flex;flex-shrink:0;height:var(--tbh);background:var(--bg2);border-bottom:1px solid var(--border2);overflow:hidden}
#tbs{flex-shrink:0;width:var(--chw);border-right:1px solid var(--border2)}
#tbsc{flex:1;position:relative;overflow:hidden}
#tbi{display:flex;height:100%}
.tl{flex-shrink:0;width:var(--sw);height:100%;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:var(--text2);border-right:1px solid var(--border);white-space:nowrap}
.tl.now{color:var(--amber)}
#rw{flex:1;overflow:hidden}
#rs{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
#rs::-webkit-scrollbar{width:4px}#rs::-webkit-scrollbar-thumb{background:var(--border2)}
.cr{display:flex;height:var(--rh);border-bottom:1px solid var(--border);cursor:pointer}
.cr:nth-child(odd){background:var(--row-a)}.cr:nth-child(even){background:var(--row-b)}
.cr:hover{background:var(--row-hover)}.cr.act{background:var(--row-active)}
.cl{flex-shrink:0;width:var(--chw);display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border-right:1px solid var(--border2);gap:1px}
.cn{font-size:20px;font-weight:700;color:var(--amber);line-height:1}
.cm{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;line-height:1.3;word-break:break-word}
.cs{flex:1;display:flex;position:relative;overflow:hidden}
.sl{flex-shrink:0;height:100%;border-right:1px solid var(--border);display:flex;align-items:center;padding:0 7px;overflow:hidden;cursor:pointer;transition:background .1s}
.sl:hover{background:rgba(255,176,0,.07)}.sl.isn{background:rgba(255,176,0,.04)}
.st{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;pointer-events:none}
.sl.isn .st,.act .sl.isn .st{color:var(--amber);font-weight:600}
.nl{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:10;pointer-events:none;box-shadow:0 0 8px rgba(200,0,0,.6)}
#sb{flex-shrink:0;height:32px;background:#060c22;border-top:1px solid var(--border2);display:flex;align-items:center;padding:0 14px;gap:14px}
.sbl{font-weight:800;font-size:13px;color:#fff}
.sbd{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:p 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.sbt{font-size:11px;color:var(--text2)}.sbsp{width:1px;height:14px;background:var(--border2)}
.sbr{margin-left:auto;display:flex;gap:10px}
.sbb{font-size:11px;color:var(--text2);cursor:pointer;border:1px solid var(--border2);padding:2px 8px;border-radius:2px;transition:all .15s}
.sbb:hover{border-color:var(--amber);color:var(--amber)}
</style>
</head>

</div>

// ═══════════════════════════════════
// SCHEDULE — deterministic, mid-show
// ═══════════════════════════════════
const SLOT_MS = 30*60*1000;
const SLOTS = 18;
const SPX = 160;

function seed(n){return String(n).split('').reduce((a,c,i)=>a+c.charCodeAt(0)*(i+7),0)}

function getSchedule(ch){
  const now=Date.now(), s=seed(ch.n);
  const day=Math.floor(now/86400000)*86400000;
  const ms=(now-day+s*7919)%86400000;
  const si=Math.floor(ms/SLOT_MS), el=ms%SLOT_MS;
  const v=ch.v[(si+s)%ch.v.length];
  return{vid:v[0],title:v[1],start:Math.floor(Math.min(el/1000,Math.max(0,600-30))),pct:Math.min((el/SLOT_MS)*100,99)};
}

function getSlots(ch,startMs){
  const s=seed(ch.n);
  return Array.from({length:SLOTS+2},(_,i)=>{
    const ms=startMs+i*SLOT_MS;
    const day=Math.floor(ms/86400000)*86400000;
    const rel=(ms-day+s*7919)%86400000;
    const si=Math.floor(rel/SLOT_MS);
    return ch.v[(si+s)%ch.v.length][1];
  });
}

function snapSlot(ms){return Math.floor(ms/SLOT_MS)*SLOT_MS}
function fmt(ms){const d=new Date(ms);let h=d.getHours(),m=d.getMinutes();const a=h>=12?'PM':'AM';h=h%12||12;return`${h}:${String(m).padStart(2,'0')} ${a}`}
function clock(){const d=new Date();let h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();const a=h>=12?'PM':'AM';h=h%12||12;return`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${a}`}

let ACT=null, GOPEN=true, NOW=Date.now(), GSTART=snapSlot(Date.now())-SLOT_MS;

function nowPx(){return((NOW-GSTART)/SLOT_MS)*SPX}

function renderTB(){
  const el=document.getElementById('tbi'); el.innerHTML='';
  for(let i=0;i<SLOTS+2;i++){
    const t=GSTART+i*SLOT_MS, isn=(t<=NOW&&NOW<t+SLOT_MS);
    const d=document.createElement('div');
    d.className='tl'+(isn?' now':'');
    d.style.width=SPX+'px';
    d.textContent=(isn?'▶ ':'')+fmt(t);
    el.appendChild(d);
  }
}

function renderRows(){
  const ri=document.getElementById('ri'); ri.innerHTML='';
  CH.forEach(ch=>{
    const row=document.createElement('div');
    row.className='cr'+(ACT&&ACT.n===ch.n?' act':'');
    row.dataset.n=ch.n;
    row.innerHTML=`<div class="cl"><div class="cn">${ch.n}</div><div class="cm">${ch.nm}</div></div>`;
    const cs=document.createElement('div'); cs.className='cs';
    const titles=getSlots(ch,GSTART);
    for(let i=0;i<SLOTS+2;i++){
      const t=GSTART+i*SLOT_MS, isn=(t<=NOW&&NOW<t+SLOT_MS);
      const s=document.createElement('div');
      s.className='sl'+(isn?' isn':'');
      s.style.width=SPX+'px';
      const tx=document.createElement('div');
      tx.className='st'; tx.textContent=titles[i]||''; tx.title=titles[i]||'';
      s.appendChild(tx);
      s.onclick=()=>tune(ch);
      cs.appendChild(s);
    }
    const nl=document.createElement('div'); nl.className='nl'; nl.style.left=nowPx()+'px';
    cs.appendChild(nl);
    row.appendChild(cs);
    row.onclick=()=>tune(ch);
    ri.appendChild(row);
  });
}

function tune(ch){
  ACT=ch; renderRows();
  document.getElementById('icn').textContent=ch.nm;
  document.getElementById('itt').textContent='Tuning…';
  document.getElementById('imt').textContent=`Ch ${ch.n}`;
  const pw=document.getElementById('pw');
  document.getElementById('nosig').style.display='flex';
  const old=pw.querySelector('iframe'); if(old)old.remove();
  const sc=getSchedule(ch);
  document.getElementById('itt').textContent=`"${sc.title}"`;
  document.getElementById('imt').innerHTML=`<b>${clock()}</b> &nbsp; Ch ${ch.n} – ${ch.nm}`;
  document.getElementById('nosig').style.display='none';
  const f=document.createElement('iframe');
  f.src=`https://www.youtube-nocookie.com/embed/${sc.vid}?autoplay=1&start=${sc.start}&controls=1&modestbranding=1&rel=0&iv_load_policy=3`;
  f.setAttribute('referrerpolicy','no-referrer-when-downgrade');
  f.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';
  f.allowFullscreen=true; f.style.opacity='0'; f.style.transition='opacity .3s';
  pw.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.opacity='1'));
}

function tog(){
  GOPEN=!GOPEN;
  document.getElementById('guide').style.display=GOPEN?'flex':'none';
  document.getElementById('gi').textContent=GOPEN?'↑':'↓';
  document.getElementById('gl').textContent=GOPEN?'HIDE GUIDE':'SHOW GUIDE';
}

let W=Math.floor(Math.random()*80)+40;
function tickW(){W+=Math.floor(Math.random()*7)-3;W=Math.max(15,Math.min(250,W));document.getElementById('wc').textContent=`${W} watching`}
setInterval(tickW,7000);

document.addEventListener('keydown',e=>{
  if(e.key==='g'||e.key==='G'){tog();return}
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();
    const i=ACT?CH.findIndex(c=>c.n===ACT.n):-1;
    const nx=e.key==='ArrowUp'?Math.max(0,i-1):Math.min(CH.length-1,i+1);
    tune(CH[nx]);
    setTimeout(()=>document.querySelector(`.cr[data-n="${CH[nx].n}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'}),50);
  }
});

let gp={};
(function pg(){const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps){if(!p)continue;[[0,'Enter'],[12,'ArrowUp'],[13,'ArrowDown'],[14,'ArrowLeft'],[15,'ArrowRight']].forEach(([b,k])=>{const on=p.buttons[b]?.pressed;if(on&&!gp[b])document.dispatchEvent(new KeyboardEvent('keydown',{key:k}));gp[b]=on;});}requestAnimationFrame(pg);})();

let ty=0;
document.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientY-ty;if(d<-50)document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown'}));if(d>50)document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp'}));},{passive:true});

function go(){
  document.getElementById('splash').classList.add('hide');
  setTimeout(()=>document.getElementById('splash').style.display='none',500);
  document.getElementById('app').style.display='flex';
  NOW=Date.now(); GSTART=snapSlot(NOW)-SLOT_MS;
  renderTB(); renderRows();
  setTimeout(()=>tune(CH[0]),600);
  setInterval(()=>{NOW=Date.now();renderTB();renderRows();},10000);
  tickW();
}
</script>
</body>
