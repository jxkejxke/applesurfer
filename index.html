<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Channel Surfer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08102a;
  --bg2:#0b1230;
  --row-a:#101640;
  --row-b:#0d1338;
  --row-hover:#192060;
  --row-active:#1e2868;
  --border:#1a2050;
  --border2:#222860;
  --amber:#ffb000;
  --white:#fff;
  --text:#a8b4d8;
  --text2:#5060a0;
  --text3:#2a3468;
  --red:#cc2000;
  --ch-w:120px;
  --slot-w:160px;
  --row-h:56px;
  --timebar-h:38px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:12px}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
.sp-logo{font-size:clamp(32px,6vw,72px);font-weight:800;color:var(--white)}
.sp-logo span{color:var(--amber)}
.sp-sub{color:var(--text2);font-size:15px}
.sp-btn{margin-top:28px;padding:12px 40px;background:var(--amber);color:#000;font-weight:700;font-size:15px;border:none;cursor:pointer;border-radius:3px;letter-spacing:.3px}
.sp-btn:hover{opacity:.88}

/* ── APP ── */
#app{width:100vw;height:100vh;display:none;flex-direction:column}

/* ── TOP ── */
#top{display:flex;flex-shrink:0;height:40vh;min-height:220px;border-bottom:2px solid var(--border2)}

/* PLAYER */
#player-wrap{flex:0 0 53%;position:relative;background:#000;overflow:hidden}
#player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;transition:opacity .3s}
#nosig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#060c22}
.nosig-t{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--text3)}
.nosig-s{font-size:11px;letter-spacing:2px;color:var(--text3)}

/* INFO PANEL */
#info{flex:1;background:var(--bg2);padding:20px 26px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--border2);overflow:hidden}
.info-chname{font-size:24px;font-weight:700;color:var(--white);line-height:1.2}
.info-title{font-size:15px;color:var(--amber);font-weight:600;line-height:1.4;margin-top:6px}
.info-meta{font-size:12px;color:var(--text2);margin-top:4px}
.info-meta b{color:var(--text)}

/* GUIDE TOGGLE */
#gtoggle{flex-shrink:0;height:26px;background:var(--bg2);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text2);font-size:11px;letter-spacing:1.5px;transition:background .15s;user-select:none}
#gtoggle:hover{background:var(--border);color:var(--text)}

/* GUIDE */
#guide{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* TIMEBAR */
#timebar{display:flex;flex-shrink:0;height:var(--timebar-h);background:var(--bg2);border-bottom:1px solid var(--border2);overflow:hidden}
#tb-spacer{flex-shrink:0;width:var(--ch-w);border-right:1px solid var(--border2)}
#tb-scroll{flex:1;position:relative;overflow:hidden}
#tb-inner{display:flex;height:100%;will-change:transform}
.tlabel{flex-shrink:0;width:var(--slot-w);height:100%;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:var(--text2);border-right:1px solid var(--border);letter-spacing:.3px;white-space:nowrap}
.tlabel.isnow{color:var(--amber)}

/* ROWS */
#rows-wrap{flex:1;overflow:hidden}
#rows-scroll{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
#rows-scroll::-webkit-scrollbar{width:4px}
#rows-scroll::-webkit-scrollbar-thumb{background:var(--border2)}

.ch-row{display:flex;height:var(--row-h);border-bottom:1px solid var(--border);cursor:pointer;overflow:hidden}
.ch-row:nth-child(odd){background:var(--row-a)}
.ch-row:nth-child(even){background:var(--row-b)}
.ch-row:hover{background:var(--row-hover)}
.ch-row.is-active{background:var(--row-active)}

.ch-label{flex-shrink:0;width:var(--ch-w);display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border-right:1px solid var(--border2);gap:1px}
.ch-num{font-size:20px;font-weight:700;color:var(--amber);line-height:1}
.ch-name{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;line-height:1.3;word-break:break-word}

.ch-slots{flex:1;display:flex;position:relative;overflow:hidden;will-change:transform}
.slot{flex-shrink:0;height:100%;border-right:1px solid var(--border);display:flex;align-items:center;padding:0 7px;overflow:hidden;transition:background .1s;cursor:pointer}
.slot:hover{background:rgba(255,176,0,.07)}
.slot.is-now{background:rgba(255,176,0,.04)}
.slot-t{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;pointer-events:none}
.slot.is-now .slot-t,.is-active .slot.is-now .slot-t{color:var(--amber);font-weight:600}

/* NOW-LINE */
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:10;pointer-events:none;box-shadow:0 0 8px rgba(200,0,0,.7)}

/* STATUS BAR */
#statusbar{flex-shrink:0;height:32px;background:#060c22;border-top:1px solid var(--border2);display:flex;align-items:center;padding:0 14px;gap:14px}
.sb-logo{font-weight:800;font-size:13px;color:var(--white);letter-spacing:.3px}
.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:sbpulse 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes sbpulse{0%,100%{opacity:1}50%{opacity:.3}}
.sb-txt{font-size:11px;color:var(--text2)}
.sb-sep{width:1px;height:14px;background:var(--border2)}
.sb-right{margin-left:auto;display:flex;gap:10px}
.sb-btn{font-size:11px;color:var(--text2);cursor:pointer;border:1px solid var(--border2);padding:2px 8px;border-radius:2px;transition:all .15s;white-space:nowrap}
.sb-btn:hover{border-color:var(--amber);color:var(--amber)}
</style>
</head>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-logo">Channel <span>Surfer</span></div>
  <div class="sp-sub">Watch YouTube Like It's Cable TV</div>
  <button class="sp-btn" onclick="startApp()">▶ PRESS TO START</button>

  <div id="gtoggle" onclick="toggleGuide()">

  <div id="guide">

    <div id="rows-wrap">

// ═══════════════════════════════════
// RSS / VIDEO CACHE
// ═══════════════════════════════════
const cache = {};

async function fetchVideos(channelId) {
  if (cache[channelId]) return cache[channelId];
  const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
  const proxies = [
    `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`,
    `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`,
  ];
  for (const p of proxies) {
    try {
      const res = await fetch(p, {signal: AbortSignal.timeout(7000)});
      let xml = '';
      if (p.includes('allorigins')) { const j = await res.json(); xml = j.contents || ''; }
      else xml = await res.text();
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const entries = [...doc.querySelectorAll('entry')];
      const videos = entries.map(e => ({
        id: e.querySelector('videoId')?.textContent || '',
        title: e.querySelector('title')?.textContent || 'Untitled',
        dur: 600 + Math.floor(Math.random() * 2400)
      })).filter(v => v.id);
      if (videos.length) { cache[channelId] = videos; return videos; }
    } catch {}
  }
  cache[channelId] = [];
  return [];
}

// ═══════════════════════════════════
// SCHEDULE
// ═══════════════════════════════════
const SLOT_MS = 30 * 60 * 1000;
const SLOTS = 18;
const SLOT_PX = 160;

function seed(id) { return id.split('').reduce((a,c,i)=>a+c.charCodeAt(0)*(i+7),0); }

function getSchedule(ch, nowMs) {
  const vs = cache[ch.id] || [];
  if (!vs.length) return null;
  const s = seed(ch.id);
  const dayMs = Math.floor(nowMs / 86400000) * 86400000;
  const ms = (nowMs - dayMs + s * 7919) % 86400000;
  const slotIdx = Math.floor(ms / SLOT_MS);
  const elapsed = ms % SLOT_MS;
  const v = vs[(slotIdx + s) % vs.length];
  const startSec = Math.min(Math.floor(elapsed / 1000), Math.max(0, v.dur - 30));
  const pct = Math.min((elapsed / SLOT_MS) * 100, 99);
  return { v, startSec, pct };
}

function getGuideSlots(ch, startMs) {
  const vs = cache[ch.id] || [];
  const s = seed(ch.id);
  return Array.from({length: SLOTS + 2}, (_, i) => {
    const ms = startMs + i * SLOT_MS;
    const dayMs = Math.floor(ms / 86400000) * 86400000;
    const relMs = (ms - dayMs + s * 7919) % 86400000;
    const slotIdx = Math.floor(relMs / SLOT_MS);
    const v = vs.length ? vs[(slotIdx + s) % vs.length] : null;
    return v ? v.title : (vs.length ? '' : 'Loading…');
  });
}

// ═══════════════════════════════════
// TIME HELPERS
// ═══════════════════════════════════
function snapToSlot(ms) { return Math.floor(ms / SLOT_MS) * SLOT_MS; }
function fmtTime(ms) {
  const d = new Date(ms);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
function fmtClock() {
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ap}`;
}

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let activeCh = null;
let guideOpen = true;
let nowMs = Date.now();
let guideStartMs = snapToSlot(nowMs) - SLOT_MS; // start 1 slot before now

// how far into the guide (in px) from guideStartMs
function nowOffsetPx() {
  return ((nowMs - guideStartMs) / SLOT_MS) * SLOT_PX;
}

// ═══════════════════════════════════
// RENDER TIMEBAR
// ═══════════════════════════════════
function renderTimebar() {
  const inner = document.getElementById('tb-inner');
  inner.innerHTML = '';
  for (let i = 0; i < SLOTS + 2; i++) {
    const t = guideStartMs + i * SLOT_MS;
    const isNow = (t <= nowMs && nowMs < t + SLOT_MS);
    const el = document.createElement('div');
    el.className = 'tlabel' + (isNow ? ' isnow' : '');
    el.style.width = SLOT_PX + 'px';
    el.textContent = (isNow ? '▶ ' : '') + fmtTime(t);
    inner.appendChild(el);
  }
}

// ═══════════════════════════════════
// RENDER ROWS
// ═══════════════════════════════════
function renderRows() {
  const inner = document.getElementById('rows-inner');
  inner.innerHTML = '';

  CHANNELS.forEach(ch => {
    const row = document.createElement('div');
    row.className = 'ch-row' + (activeCh?.num === ch.num ? ' is-active' : '');
    row.dataset.num = ch.num;

    // Label
    row.innerHTML = `<div class="ch-label"><div class="ch-num">${ch.num}</div><div class="ch-name">${ch.name}</div></div>`;

    // Slots container
    const slotsEl = document.createElement('div');
    slotsEl.className = 'ch-slots';

    const titles = getGuideSlots(ch, guideStartMs);
    for (let i = 0; i < SLOTS + 2; i++) {
      const t = guideStartMs + i * SLOT_MS;
      const isNow = (t <= nowMs && nowMs < t + SLOT_MS);
      const slot = document.createElement('div');
      slot.className = 'slot' + (isNow ? ' is-now' : '');
      slot.style.width = SLOT_PX + 'px';
      const txt = document.createElement('div');
      txt.className = 'slot-t';
      txt.textContent = titles[i] || '';
      txt.title = titles[i] || '';
      slot.appendChild(txt);
      slot.addEventListener('click', () => tuneToChannel(ch));
      slotsEl.appendChild(slot);
    }

    // Red now-line
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.left = nowOffsetPx() + 'px';
    slotsEl.appendChild(line);

    row.appendChild(slotsEl);
    row.addEventListener('click', () => tuneToChannel(ch));
    inner.appendChild(row);
  });
}

// ═══════════════════════════════════
// TUNE
// ═══════════════════════════════════
function tuneToChannel(ch) {
  activeCh = ch;
  renderRows();

  document.getElementById('info-chname').textContent = ch.name;
  document.getElementById('info-title').textContent = 'Tuning…';
  document.getElementById('info-meta').textContent = `Ch ${ch.num}`;

  const wrap = document.getElementById('player-wrap');
  document.getElementById('nosig').style.display = 'flex';
  const old = wrap.querySelector('iframe');
  if (old) old.remove();

  fetchVideos(ch.id).then(() => {
    renderRows(); // update guide with real titles
    const sched = getSchedule(ch, Date.now());
    if (!sched) {
      document.getElementById('info-title').textContent = 'No videos available';
      return;
    }
    document.getElementById('info-title').textContent = `"${sched.v.title}"`;
    document.getElementById('info-meta').innerHTML =
      `<b>${fmtClock()}</b>&nbsp;&nbsp;Ch ${ch.num} – ${ch.name}`;
    document.getElementById('nosig').style.display = 'none';

    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube-nocookie.com/embed/${sched.v.id}?autoplay=1&start=${sched.startSec}&controls=1&modestbranding=1&rel=0&iv_load_policy=3&origin=${encodeURIComponent(location.origin||'https://channelsurfer.tv')}`;
    iframe.setAttribute('referrerpolicy','no-referrer-when-downgrade');
    iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.style.opacity = '0';
    iframe.style.transition = 'opacity .35s';
    wrap.appendChild(iframe);
    requestAnimationFrame(() => requestAnimationFrame(() => iframe.style.opacity = '1'));
  });
}

// ═══════════════════════════════════
// GUIDE TOGGLE
// ═══════════════════════════════════
function toggleGuide() {
  guideOpen = !guideOpen;
  document.getElementById('guide').style.display = guideOpen ? 'flex' : 'none';
  document.getElementById('gi').textContent = guideOpen ? '⬆' : '⬇';
  document.getElementById('gt').textContent = guideOpen ? 'HIDE GUIDE' : 'SHOW GUIDE';
}

// ═══════════════════════════════════
// KEYBOARD / REMOTE
// ═══════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'g' || e.key === 'G') { toggleGuide(); return; }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const idx = activeCh ? CHANNELS.findIndex(c => c.num === activeCh.num) : -1;
    const next = e.key === 'ArrowUp'
      ? Math.max(0, idx - 1)
      : Math.min(CHANNELS.length - 1, idx + 1);
    tuneToChannel(CHANNELS[next]);
    setTimeout(() => {
      document.querySelector(`.ch-row[data-num="${CHANNELS[next].num}"]`)
        ?.scrollIntoView({block:'nearest',behavior:'smooth'});
    }, 50);
  }
});

// Gamepad (Apple TV Siri Remote)
let gps = {};
(function pollGP() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    [[0,'Enter'],[12,'ArrowUp'],[13,'ArrowDown'],[14,'ArrowLeft'],[15,'ArrowRight']].forEach(([b,k]) => {
      const on = p.buttons[b]?.pressed;
      if (on && !gps[b]) document.dispatchEvent(new KeyboardEvent('keydown',{key:k}));
      gps[b] = on;
    });
    const ay = p.axes[1]||0;
    if (ay < -0.6 && !gps.ayu) { document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp'})); gps.ayu=true; }
    else if (ay >= -0.6) gps.ayu = false;
    if (ay > 0.6 && !gps.ayd) { document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown'})); gps.ayd=true; }
    else if (ay <= 0.6) gps.ayd = false;
  }
  requestAnimationFrame(pollGP);
})();

// Touch swipe
let ty = 0;
document.addEventListener('touchstart', e => ty = e.touches[0].clientY, {passive:true});
document.addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientY - ty;
  if (d < -50) document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown'}));
  if (d > 50)  document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp'}));
}, {passive:true});

// ═══════════════════════════════════
// WATCHERS
// ═══════════════════════════════════
let w = Math.floor(Math.random()*80)+40;
function tickWatchers() {
  w += Math.floor(Math.random()*7)-3;
  w = Math.max(15, Math.min(250, w));
  document.getElementById('sb-w').textContent = `${w} watching`;
}
setInterval(tickWatchers, 7000);

// ═══════════════════════════════════
// START
// ═══════════════════════════════════
function startApp() {
  document.getElementById('splash').classList.add('hide');
  setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
  document.getElementById('app').style.display = 'flex';

  nowMs = Date.now();
  guideStartMs = snapToSlot(nowMs) - SLOT_MS;

  renderTimebar();
  renderRows();

  // Fetch first 8 channels immediately, rest staggered
  CHANNELS.slice(0, 8).forEach((ch, i) =>
    setTimeout(() => fetchVideos(ch.id).then(() => renderRows()), i * 200));
  CHANNELS.slice(8).forEach((ch, i) =>
    setTimeout(() => fetchVideos(ch.id).then(() => renderRows()), 2000 + i * 300));

  // Auto-tune ch 2
  setTimeout(() => tuneToChannel(CHANNELS[0]), 700);

  // Tick clock every 10s
  setInterval(() => {
    nowMs = Date.now();
    renderTimebar();
    renderRows();
  }, 10000);

  tickWatchers();
}
</script>
